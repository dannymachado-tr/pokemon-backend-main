services:
  main_app_pokemon-backend:
    build:
      context: ..
      dockerfile: codeCake/Dockerfile
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped
    networks:
      pokemon-network:
        aliases:
          - pokemon-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
networks:
  pokemon-network:
    external: true
    name: ${POKEMON_NETWORK:-pokemon-codecake}
